name: Deploy to Development

on:
  push:
    branches: [ develop, dev ]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'tools/**'
      - 'requirements.txt'
      - 'pyproject.toml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH for Development
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.DEV_SERVER_HOST }} >> ~/.ssh/known_hosts
    
    - name: Deploy to Development Server
      run: |
        ssh ${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_HOST }} << 'EOF'
          set -e
          
          cd ${{ secrets.DEV_PROJECT_PATH }}
          
          echo "🚀 Deploying to Development Environment..."
          
          # Pull latest changes
          git fetch origin
          git reset --hard origin/develop 2>/dev/null || git reset --hard origin/dev 2>/dev/null || git reset --hard origin/main
          
          # Set up commit tools
          chmod +x bin/commit 2>/dev/null || true
          chmod +x tools/git/commit 2>/dev/null || true
          
          # Update dependencies
          if [ -f requirements.txt ]; then
            python3 -m pip install --user -r requirements.txt
          fi
          
          # Test the bot (without starting it)
          echo "🧪 Running basic tests..."
          python3 -m py_compile src/bot.py
          
          echo "✅ Development deployment completed!"
        EOF
    
    - name: Test commit tool on dev server
      run: |
        ssh ${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_HOST }} << 'EOF'
          cd ${{ secrets.DEV_PROJECT_PATH }}
          
          if [ -f bin/commit ]; then
            echo "Testing commit tool..."
            ./bin/commit --help
            echo "✅ Commit tool test passed"
          else
            echo "❌ Commit tool not found"
            exit 1
          fi
        EOF