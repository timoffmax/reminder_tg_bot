name: Deploy Reminder Bot to Production

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'setup_db.py'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even without changes'
        required: false
        default: 'false'
        type: boolean
      restart_only:
        description: 'Only restart the bot service without updating code'
        required: false
        default: 'false'
        type: boolean

jobs:
  deploy:
    runs-on: self-hosted
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Verify runner environment
      run: |
        echo "🔍 Verifying self-hosted runner environment..."
        whoami
        pwd
        echo "Runner is ready for deployment"
    
    - name: Deploy Reminder Bot
      run: |
        set -e
        
        SERVICE_NAME="reminder-bot"
        PROJECT_PATH="/var/www/reminder_tg_bot"
        
        echo "🤖 Deploying Reminder Telegram Bot..."
        
        # Stop the bot service if running
        if sudo systemctl is-active --quiet $SERVICE_NAME; then
          echo "⏹️  Stopping bot service..."
          sudo systemctl stop $SERVICE_NAME
        fi
        
        # Navigate to project directory
        cd $PROJECT_PATH
        
        # Backup current version
        if [ -d "backup" ]; then
          sudo rm -rf backup.old
          sudo mv backup backup.old
        fi
        sudo mkdir -p backup
        sudo cp -r src/ backup/ 2>/dev/null || true
        sudo cp -r *.py backup/ 2>/dev/null || true
        sudo cp requirements.txt backup/ 2>/dev/null || true
        
        # Pull latest changes (skip if restart_only)
        if [ "${{ inputs.restart_only }}" != "true" ]; then
          echo "📥 Pulling latest changes..."
          sudo git fetch origin
          sudo git reset --hard origin/master
          
          # Update Python dependencies as reminder_bot user
          echo "📦 Updating Python dependencies..."
          if [ -f requirements.txt ]; then
            sudo -u reminder_bot bash -c "cd $PROJECT_PATH && source venv/bin/activate && pip install -r requirements.txt --upgrade"
          fi
          
          # Set up database as reminder_bot user
          if [ -f setup_db.py ]; then
            echo "🗄️  Setting up database..."
            sudo -u reminder_bot bash -c "cd $PROJECT_PATH && source venv/bin/activate && python setup_db.py"
          fi
        else
          echo "⚡ Restart-only mode: skipping code update"
        fi
        
        # Fix permissions
        sudo chown -R reminder_bot:reminder_bot $PROJECT_PATH
        
        # Start the bot service
        echo "🚀 Starting bot service..."
        sudo systemctl start $SERVICE_NAME
        
        # Wait a bit for service to start
        sleep 3
        
        # Enable service to start on boot
        sudo systemctl enable $SERVICE_NAME
        
        echo "✅ Bot deployment completed successfully!"
    
    - name: Verify bot deployment
      run: |
        SERVICE_NAME="reminder-bot"
        PROJECT_PATH="/var/www/reminder_tg_bot"
        
        echo "🔍 Verifying bot deployment..."
        
        # Check service status
        if sudo systemctl is-active --quiet $SERVICE_NAME; then
          echo "✅ Bot service is running"
          sudo systemctl status $SERVICE_NAME --no-pager -l
        else
          echo "❌ Bot service is not running"
          echo "📋 Service logs:"
          sudo journalctl -u $SERVICE_NAME --no-pager -n 20
          exit 1
        fi
        
        # Check if bot process is running
        if pgrep -f "python.*src\.bot" > /dev/null; then
          echo "✅ Bot process is active"
        else
          echo "⚠️  Bot process not found, checking service logs..."
          sudo journalctl -u $SERVICE_NAME --no-pager -n 10
        fi
        
        # Test database connection
        echo "🔍 Testing database connection..."
        cd $PROJECT_PATH
        sudo -u reminder_bot bash -c "source venv/bin/activate && python -c 'from src.database import init_db; init_db(); print(\"✅ Database connection successful\")'" 2>/dev/null || echo "⚠️  Database test failed"
        
        echo "🎉 Bot verification completed!"
    
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Deployment failed! Check the logs above for details."
        # You can add notification integrations here (Slack, Discord, etc.)
    
    - name: Notify on success
      if: success()
      run: |
        echo "🎉 Deployment successful! Your reminder bot is updated."
        # You can add notification integrations here (Slack, Discord, etc.)